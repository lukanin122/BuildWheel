name: BuildWheel platform compatibility
on:
  push:
    branches:
      - test/platform-compatibility
      - feature/android-desktop-input
    paths:
      - .github/workflows/platform-compatibility.yml
      - tests/platform/**
      - scripts/**
      - bundles/**
      - mod.hjson
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buildwheel-platform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/test/platform-compatibility' || github.ref == 'refs/heads/feature/android-desktop-input'
    name: ${{ matrix.name }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            arch: x64
            machine: x86_64
          - name: macOS 15 Intel x64
            runner: macos-15-intel
            arch: x64
            machine: x86_64
          - name: macOS 15 ARM64
            runner: macos-15
            arch: aarch64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux' || !contains(github.event.head_commit.message, '[linux-only]')
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.arch }}
      - name: Install Linux graphical test environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb openbox xdotool xinput x11-utils mesa-utils libgl1-mesa-dri libegl1 libgles2 weston wayland-utils dbus-x11 build-essential libx11-dev libxext-dev libgl-dev
      - name: Execute isolated platform tests
        if: runner.os == 'Linux' || !contains(github.event.head_commit.message, '[linux-only]')
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          PLATFORM_LABEL: ${{ matrix.name }}
        run: python3 tests/platform/run.py --output "$RUNNER_TEMP/buildwheel-platform-results"
      - name: Save native diagnostics
        if: always() && (runner.os == 'Linux' || !contains(github.event.head_commit.message, '[linux-only]'))
        uses: actions/upload-artifact@v4
        with:
          name: buildwheel-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buildwheel-platform-results
            !${{ runner.temp }}/buildwheel-platform-results/Mindustry.jar
            !${{ runner.temp }}/buildwheel-platform-results/sdl-no-xinput/SDL2-2.0.10/**
            !${{ runner.temp }}/buildwheel-platform-results/sdl-no-xinput/SDL2-2.0.10.tar.gz
          if-no-files-found: warn
          retention-days: 14
  android:
    if: github.ref == 'refs/heads/feature/android-desktop-input'
    name: Android API 30 x86_64 desktop input
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 36 build prerequisites
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM for the disposable AVD
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build test-only actual Android client
        run: python3 tests/platform/android-ci.py prepare --output "$RUNNER_TEMP/buildwheel-android-results"
      - name: Actual Android emulator execution
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tests/platform/android-ci.py run --output "$RUNNER_TEMP/buildwheel-android-results"
      - name: Save Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildwheel-real-android-api30
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/buildwheel-android-results/*-provenance.json
            ${{ runner.temp }}/buildwheel-android-results/*-failure.json
            ${{ runner.temp }}/buildwheel-android-results/*-context.json
            ${{ runner.temp }}/buildwheel-android-results/*-summary.json
            ${{ runner.temp }}/buildwheel-android-results/*-hashes.json
            ${{ runner.temp }}/buildwheel-android-results/*.log
            ${{ runner.temp }}/buildwheel-android-results/initial/
            ${{ runner.temp }}/buildwheel-android-results/restart-1600/
            ${{ runner.temp }}/buildwheel-android-results/restart-1920/
