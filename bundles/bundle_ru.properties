buildwheel.controls.edge-shift = Сдвиг колеса при нехватке места: {0}%
buildwheel.controls.edge-shift.description = Доля на которую колесо строительства отодвигается при нехватке места на экране, перемещая и курсор. Работает с обычной мышью и с относительным вводом.

buildwheel.controls.disable-number-keys = Отключить "категория/выбор блока №"
buildwheel.controls.disable-number-keys.description = В Mindustry цифры 0-9 в настройках управления по умолчанию используются как быстрые клавиши выбора категорий и блоков, тем самым присваивая каждому блоку свой номер.

buildwheel.controls.clip-outer = Ограничить курсор диаметром колеса
buildwheel.controls.clip-outer.description = Останавливает движение курсора за границу диаметра открытого колеса строительства у это самой границы.

buildwheel.controls.clip-inner = Ограничить курсор внутренним кругом
buildwheel.controls.clip-inner.description = Останавливает движение курсора чуть за границей внутренного круга колеса строительства - для молниеносного выбора.

buildwheel.controls.wheel-selection = Выбор колеса
buildwheel.controls.secondary = Второстепенная
buildwheel.controls.primary = Основная
buildwheel.controls.wheel-binding = Колесо {0}

buildwheel.menu.radial-title = Радиальное меню

buildwheel.menu.palette-title = Палитра

buildwheel.controls.palette-in-menu = Открывать палитру в главном меню
buildwheel.controls.palette-in-menu.description = Новый раздел в Базе данных. Комбинация быстрых клавиш для Палитры срабатывает и в главном меню.

buildwheel.controls.scroll-key = Клавиша + колёсико мыши
buildwheel.controls.scroll-key.description = Клавиша перехватывает 'Масштабирование' колёсиком, по умолчанию отключено.

buildwheel.controls.show-number = Отображать номер колеса

buildwheel.controls.relative-mouse = Относительный ввод мыши для колёс
buildwheel.controls.relative-mouse.description = Relative Mouse Mode - Δx и Δy вместо абсолютного ввода.
buildwheel.controls.custom-arrow.description = Кастомная стрелка курсора - чтоб не путали когда нестандартный ввод.

buildwheel.controls.wheel-open-pitch = Градация звука открытия по номеру
buildwheel.controls.wheel-open-pitch.description = Приглушение звука открытия в соответствии с номером колеса.

